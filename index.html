    <script>
      (function() {
        // Auto-bridge for VS Code Live Server (port 5500/5501) to live Vite/Node server on 3000
        if (window.location.port === '5500' || window.location.port === '5501' || window.location.port === '5502') {
          if (window.location.pathname.indexOf('/dist/') !== -1) return;
          fetch('http://localhost:3000/api/v1/health')
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d && d.status === 'ok') {
                window.location.replace('http://localhost:3000' + window.location.hash);
              } else {
                window.location.replace('/dist/index.html' + window.location.hash);
              }
            })
            .catch(function() {
              window.location.replace('/dist/index.html' + window.location.hash);
            });
        }
      })();
    </script>
