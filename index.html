<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var p = window.location.port;
      if (p >= '5500' && p <= '5510') {
        var targetHost = window.location.hostname || 'localhost';
        var targetUrl = 'http://' + targetHost + ':3000' + (window.location.hash || '');
        window.location.replace(targetUrl);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYX AI (Windows Edition) — Discover. Detect. Defend.</title>
  <meta name="description"
    content="MYX AI by Midhun Krishnan — Discover. Detect. Defend. AI-Powered Cybersecurity Assessment, Vulnerability Management, Windows 10/11 System Auditing & Security Intelligence SaaS Platform." />
  <meta property="og:title" content="MYX AI (Windows Edition) — Discover. Detect. Defend." />
  <meta property="og:description"
    content="MYX AI by Midhun Krishnan — Discover. Detect. Defend. AI-Powered Cybersecurity Assessment, Vulnerability Management, Windows 10/11 System Auditing & Security Intelligence SaaS Platform." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/aistudio/logo-128.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="/assets/aistudio/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/aistudio/logo-128.png" />

  <!-- Preload Critical LCP Image -->
  <link rel="preload" as="image" href="/assets/aistudio/logo-128.webp" type="image/webp" fetchpriority="high" />

  <!-- Critical Inline Styles for Instant FCP & Zero Layout Shift -->
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      margin: 0;
      background-color: #0B0D10;
      color: #F5F7FA;
    }
    .myx-pre-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .myx-pre-card {
      width: 100%;
      max-width: 448px;
    }
  </style>

  <!-- Non-blocking font delivery with system font fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" />
  </noscript>
</head>

<body
  class="bg-[#0B0D10] text-[#F5F7FA] antialiased selection:bg-[#D6AE45]/30 selection:text-[#F5F7FA] overflow-x-hidden">
  <div id="root">
    <!-- Instant First Contentful Paint (FCP) Pre-render Shell -->
    <div class="myx-pre-shell">
      <div class="myx-pre-card">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
          <div style="width:56px; height:56px; border-radius:12px; background:#101318; border:1px solid rgba(214,174,69,0.4); display:flex; align-items:center; justify-content:center; padding:6px; flex-shrink:0;">
            <img src="/assets/aistudio/logo-128.webp" alt="MYX AI Logo" width="56" height="56" style="width:100%; height:100%; object-fit:contain;" fetchpriority="high" decoding="async" />
          </div>
          <div>
            <div style="font-size:16px; font-weight:700; color:#F5F7FA; line-height:1.2;">MYX AI by Midhun Krishnan</div>
            <div style="font-size:12px; color:#D6AE45; margin-top:2px;">Windows Edition · Discover. Detect. Defend.</div>
          </div>
        </div>
        <div style="background:#101318; border:1px solid #29313B; border-radius:12px; padding:24px; min-height:260px;">
          <div style="height:18px; width:150px; background:#1A2028; border-radius:4px; margin-bottom:16px;"></div>
          <div style="height:42px; width:100%; background:#141920; border-radius:8px; margin-bottom:12px; border:1px solid #222B36;"></div>
          <div style="height:42px; width:100%; background:#141920; border-radius:8px; margin-bottom:16px; border:1px solid #222B36;"></div>
          <div style="height:42px; width:100%; background:#D6AE45; border-radius:8px; opacity:0.85;"></div>
        </div>
      </div>
    </div>
    <noscript>
      <div
        style="font-family:sans-serif; min-height:100vh; background:#0B0D10; color:#F5F7FA; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div
          style="max-width:480px; background:#141920; border:1px solid #29313B; border-radius:12px; padding:32px; text-align:center;">
          <h2 style="font-size:20px; font-weight:700; color:#D6AE45; margin-bottom:12px;">MYX AI (Windows Edition)</h2>
          <p style="font-size:14px; color:#A7B0BC; line-height:1.6; margin-bottom:20px;">JavaScript is required to run the MYX AI security portal.</p>
          <a href="http://localhost:3000"
            style="display:inline-block; padding:12px 24px; background:#D6AE45; color:#0B0D10; font-weight:600; font-size:14px; border-radius:8px; text-decoration:none;">Open App on Port 3000 &rarr;</a>
        </div>
      </div>
    </noscript>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
